<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さんすうひろば</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
@keyframes fpop{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes marubig{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
@keyframes slowfade{0%{opacity:1}100%{opacity:0.08}}
@keyframes allin{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
@keyframes splitin{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes msgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100vh;font-family:'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;background:#F3F5FB;color:#20242F;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit}
.tapbtn{border:none;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .15s ease,color .15s ease}
.tapbtn:active{transform:scale(.95)}
.view{animation:viewin .34s cubic-bezier(.16,1,.3,1) both}
</style>
</head>
<body>
<div id="app"></div>
<script>
const {useState,useEffect,useRef,createElement:h}=React;

/* ---------- サウンド ---------- */
let AC=null;
function tone(freq,dur,type='sine',vol=0.26,delay=0){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime+delay);g.gain.setValueAtTime(0,AC.currentTime+delay);g.gain.linearRampToValueAtTime(vol,AC.currentTime+delay+0.01);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur+0.05);}catch(e){}}
const okSound=()=>{tone(523,.12);tone(659,.12,'sine',.26,.1);tone(784,.2,'sine',.26,.2)};
const ngSound=()=>{tone(300,.08,'square',.18);tone(250,.15,'square',.18,.1)};
const fanfare=()=>[[523,.15,0],[659,.15,.15],[784,.15,.3],[1047,.1,.45],[784,.08,.55],[1047,.3,.63]].forEach(([f,d,t])=>tone(f,d,'sine',.3,t));

/* ---------- 正解演出（手描き○×△キャンバス） ---------- */
function MaruOverlay({show,mk}){
  const ref=useRef(null);
  useEffect(()=>{if(!show||!ref.current)return;const canvas=ref.current,ctx=canvas.getContext('2d');ctx.clearRect(0,0,160,160);const cx=80,cy=80,r=62,col='#FF6B6B';let f=0;function go(){ctx.clearRect(0,0,160,160);const prog=Math.min(1,f/22);ctx.strokeStyle=col;ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();const pts=Math.floor(prog*80);for(let i=0;i<=pts;i++){const ang=-Math.PI/2+(i/80)*Math.PI*2;const x=cx+(r+(Math.random()-.5)*.8)*Math.cos(ang),y=cy+(r+(Math.random()-.5)*.8)*Math.sin(ang);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();f++;if(f<=22)requestAnimationFrame(go);}go();},[show,mk]);
  if(!show)return null;
  return h('div',{style:{position:'fixed',inset:0,pointerEvents:'none',zIndex:600,display:'flex',alignItems:'center',justifyContent:'center'}},h('div',{style:{animation:'marubig .38s cubic-bezier(.175,.885,.32,1.275) forwards'}},h('canvas',{ref,width:160,height:160})));
}

function ResultMark({mark}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    const canvas=ref.current,ctx=canvas.getContext('2d'),W=180,H=180,cx=90,cy=90;
    ctx.clearRect(0,0,W,H);
    function j(v,a=1){return v+(Math.random()-.5)*a;}
    if(mark==='hanamaru'){
      const SO=33,BR=SO+14,PR=21,N=6,SEG=36,col='#FF6B6B';const op=[];
      for(let i=0;i<N;i++){const ac=(i/N)*Math.PI*2-Math.PI/2,pcx=cx+BR*Math.cos(ac),pcy=cy+BR*Math.sin(ac);const aS=ac+Math.PI*.55,aE=ac-Math.PI*.55;for(let s=0;s<=SEG;s++){const t=s/SEG,a=aS+(aE-aS)*t;op.push({x:j(pcx+PR*Math.cos(a),.8),y:j(pcy+PR*Math.sin(a),.8)});}const nA=((i+1)/N)*Math.PI*2-Math.PI/2,vA=(ac+nA)/2,vr=BR-10,vx=cx+vr*Math.cos(vA),vy=cy+vr*Math.sin(vA);const last=op[op.length-1],npcx=cx+BR*Math.cos(nA),npcy=cy+BR*Math.sin(nA),nS=nA+Math.PI*.55;const nx=j(npcx+PR*Math.cos(nS),.8),ny=j(npcy+PR*Math.sin(nS),.8);for(let s=1;s<=10;s++){const t=s/10;let x,y;if(t<.5){const tt=t*2;x=last.x+(vx-last.x)*tt;y=last.y+(vy-last.y)*tt;}else{const tt=(t-.5)*2;x=vx+(nx-vx)*tt;y=vy+(ny-vy)*tt;}op.push({x:j(x,.7),y:j(y,.7)});}}
      op.push({...op[0]});const sp=[];for(let i=0;i<=240;i++){const t=i/240,ang=-Math.PI/2+t*2.0*Math.PI*2,r=SO*(1-t*.82);sp.push({x:j(cx+r*Math.cos(ang),.9),y:j(cy+r*Math.sin(ang),.9)});}
      let f=0;function dp(pts,n,lw){if(n<2)return;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<n;i++){const p=pts[i-1],q=pts[i];ctx.quadraticCurveTo(j((p.x+q.x)/2,.3),j((p.y+q.y)/2,.3),q.x,q.y);}ctx.stroke();}
      function tick(){ctx.clearRect(0,0,W,H);ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';dp(op,Math.floor(Math.min(1,f/52)*op.length),9);if(f>=30){dp(sp,Math.floor(Math.min(1,(f-30)/60)*sp.length),7);}f++;if(f<=90)requestAnimationFrame(tick);}tick();
    }else if(mark==='nijumaru'){
      const col='#FF6B6B';let f=0,outer=[];
      function aO(){const prog=Math.min(1,f/32),pts=Math.floor(prog*80);outer=[];ctx.clearRect(0,0,W,H);ctx.strokeStyle=col;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=pts;i++){const ang=-Math.PI/2+(i/80)*Math.PI*2;const x=cx+j(46*Math.cos(ang),.9),y=cy+j(46*Math.sin(ang),.9);outer.push({x,y});i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();f++;if(f<=32)requestAnimationFrame(aO);else aI();}
      let f2=0;function aI(){const prog=Math.min(1,f2/28),pts=Math.floor(prog*80);ctx.clearRect(0,0,W,H);if(outer.length>1){ctx.strokeStyle=col;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(outer[0].x,outer[0].y);outer.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=pts;i++){const ang=-Math.PI/2+(i/80)*Math.PI*2;const x=cx+j(28*Math.cos(ang),.8),y=cy+j(28*Math.sin(ang),.8);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();f2++;if(f2<=28)requestAnimationFrame(aI);}aO();
    }else if(mark==='maru'){
      const col='#FF6B6B';let f=0;function go(){ctx.clearRect(0,0,W,H);ctx.strokeStyle=col;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();const pts=Math.floor(Math.min(1,f/38)*90);for(let i=0;i<=pts;i++){const ang=-Math.PI/2+(i/90)*Math.PI*2;const x=cx+j(50*Math.cos(ang),1),y=cy+j(50*Math.sin(ang),1);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();f++;if(f<=38)requestAnimationFrame(go);}go();
    }else{
      const col='#FFA94D',pa=[{x:90,y:16},{x:158,y:150},{x:22,y:150},{x:90,y:16}];let f=0;function go(){const prog=Math.min(1,f/44),drawn=prog*(pa.length-1);ctx.clearRect(0,0,W,H);ctx.strokeStyle=col;ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(j(pa[0].x,1),j(pa[0].y,1));for(let i=1;i<pa.length;i++){if(drawn>=i)ctx.lineTo(j(pa[i].x,1),j(pa[i].y,1));else if(drawn>i-1){const t=drawn-(i-1),x=pa[i-1].x+(pa[i].x-pa[i-1].x)*t,y=pa[i-1].y+(pa[i].y-pa[i-1].y)*t;ctx.lineTo(j(x,1),j(y,1));break;}}ctx.stroke();f++;if(f<=44)requestAnimationFrame(go);}go();
    }
  },[mark]);
  return h('canvas',{ref,width:180,height:180});
}

/* ---------- 演算カラートークン ---------- */
const OPC={
  '+':{label:'たしざん',sym:'＋',color:'#FF6B6B',dark:'#E14F4A',bg:'#FFF1F0'},
  '-':{label:'ひきざん',sym:'－',color:'#4D96FF',dark:'#3576DE',bg:'#EFF5FF'},
  '×':{label:'かけざん',sym:'×',color:'#FFA94D',dark:'#E8862C',bg:'#FFF5E9'},
  '÷':{label:'わりざん',sym:'÷',color:'#9775FA',dark:'#7C4FE0',bg:'#F4EFFF'},
};

/* ---------- 可視化パーツ ---------- */
const FRUITS=['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🍍','🥝','🍌','🍉','🫐'];

function BlockRow({count,fill,border}){return h('div',{style:{display:'flex',gap:2}},Array.from({length:count},(_,i)=>h('div',{key:i,style:{width:14,height:18,background:fill,border:`1.5px solid ${border}`,borderRadius:4}})));}

function AddVisual({a,b,level}){
  const fr=FRUITS[(a+b)%FRUITS.length];
  const A=OPC['+'],B=OPC['-'];
  if(level>=50){
    const rA=Math.floor(a/10),rB=Math.floor(b/10),remA=a%10,remB=b%10;
    return h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'flex-start',justifyContent:'center',gap:14,padding:'6px 2px'}},
      h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:4}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:2}},
          Array.from({length:rA},(_,i)=>h(BlockRow,{key:i,count:10,fill:A.bg,border:A.color})),
          remA>0&&h(BlockRow,{count:remA,fill:A.bg,border:A.color})
        ),
        h('div',{style:{fontSize:'.72rem',fontWeight:800,color:A.color}},a+'こ')
      ),
      h('div',{style:{fontSize:'1.5rem',fontWeight:900,color:'#8A93A6',alignSelf:'center'}},'＋'),
      h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:4}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:2}},
          Array.from({length:rB},(_,i)=>h(BlockRow,{key:i,count:10,fill:B.bg,border:B.color})),
          remB>0&&h(BlockRow,{count:remB,fill:B.bg,border:B.color})
        ),
        h('div',{style:{fontSize:'.72rem',fontWeight:800,color:B.color}},b+'こ')
      )
    );
  }
  return h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'center',gap:8,padding:'6px 2px'}},
    h('div',{style:{border:`2px solid ${A.color}`,borderRadius:16,padding:'6px 8px',background:A.bg,display:'flex',flexWrap:'wrap',gap:3,justifyContent:'center',maxWidth:150}},Array.from({length:a},(_,i)=>h('span',{key:i,style:{fontSize:'1.2rem',animation:`fpop .18s ${i*0.04}s both`,display:'inline-block'}},fr))),
    h('div',{style:{fontSize:'1.5rem',fontWeight:900,color:'#8A93A6'}},'＋'),
    h('div',{style:{border:`2px solid ${B.color}`,borderRadius:16,padding:'6px 8px',background:B.bg,display:'flex',flexWrap:'wrap',gap:3,justifyContent:'center',maxWidth:150}},Array.from({length:b},(_,i)=>h('span',{key:i,style:{fontSize:'1.2rem',animation:`fpop .18s ${(a+i)*0.04}s both`,display:'inline-block'}},fr)))
  );
}

function SubVisual({a,b,level}){
  const fr=FRUITS[a%FRUITS.length];
  const A=OPC['+'],B=OPC['-'];
  const [phase,setPhase]=useState('show');
  useEffect(()=>{setPhase('show');const t1=setTimeout(()=>setPhase('blink'),500);const t2=setTimeout(()=>setPhase('fade'),2000);return()=>{clearTimeout(t1);clearTimeout(t2);};},[a,b]);
  const blinkStyle=phase==='blink'?{animation:'blink 0.45s ease-in-out 3'}:phase==='fade'?{animation:'slowfade 1.8s ease-in-out forwards'}:{};
  if(level>=50){
    const rows=Math.floor(a/10),rem=a%10;let idx=0;const rowData=[];
    for(let r=0;r<rows;r++){const row=[];for(let c=0;c<10;c++){row.push(idx>=(a-b));idx++;}rowData.push(row);}
    const remRow=[];for(let c=0;c<rem;c++){remRow.push(idx>=(a-b));idx++;}
    return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'6px 2px'}},
      h('div',{style:{border:`2px solid ${A.color}`,borderRadius:16,padding:'8px 9px',background:A.bg,display:'flex',flexDirection:'column',gap:2}},
        rowData.map((row,ri)=>h('div',{key:ri,style:{display:'flex',gap:2}},row.map((isG,ci)=>h('div',{key:ci,style:{width:14,height:18,background:isG?(phase==='fade'?'#EDEEF2':B.bg):A.bg,border:`1.5px solid ${isG?(phase==='fade'?'#CCD0D9':B.color):A.color}`,borderRadius:4,...(isG?blinkStyle:{})}})))),
        remRow.length>0&&h('div',{style:{display:'flex',gap:2}},remRow.map((isG,ci)=>h('div',{key:ci,style:{width:14,height:18,background:isG?(phase==='fade'?'#EDEEF2':B.bg):A.bg,border:`1.5px solid ${isG?(phase==='fade'?'#CCD0D9':B.color):A.color}`,borderRadius:4,...(isG?blinkStyle:{})}})))
      ),
      h('div',{style:{fontSize:'.76rem',color:B.color,fontWeight:800,background:B.bg,borderRadius:50,padding:'3px 14px'}},'➖ '+b+'こ なくなるよ')
    );
  }
  const remain=a-b;
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'6px 2px'}},
    h('div',{style:{border:`2px solid ${A.color}`,borderRadius:18,padding:'9px 11px',background:A.bg,display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center',maxWidth:280,alignItems:'center'}},
      Array.from({length:remain},(_,i)=>h('span',{key:'r'+i,style:{fontSize:'1.3rem',display:'inline-block',animation:`fpop .18s ${i*0.03}s both`}},fr)),
      remain<a&&h('div',{style:{border:`2px solid ${B.color}`,borderRadius:12,padding:'4px 6px',background:B.bg,display:'flex',flexWrap:'wrap',gap:3,...blinkStyle}},Array.from({length:b},(_,i)=>h('span',{key:'g'+i,style:{fontSize:'1.3rem',display:'inline-block'}},fr)))
    ),
    h('div',{style:{fontSize:'.76rem',color:B.color,fontWeight:800,background:B.bg,borderRadius:50,padding:'3px 14px'}},'➖ '+b+'こ なくなるよ')
  );
}

function MulVisual({a,b}){
  const M=OPC['×'];
  const bs=a<=4?20:a<=6?17:a<=8?14:11;
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'4px'}},
    h('div',{style:{display:'flex',gap:6,marginBottom:4,flexWrap:'wrap',justifyContent:'center'}},
      h('div',{style:{fontSize:'.76rem',fontWeight:800,color:M.dark,background:M.bg,borderRadius:50,padding:'3px 13px'}},'1グループに '+a+'こ'),
      h('div',{style:{fontSize:'.76rem',fontWeight:800,color:M.dark,background:M.bg,borderRadius:50,padding:'3px 13px'}},'グループが '+b+'つ')
    ),
    h('div',{style:{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',maxWidth:300}},
      Array.from({length:b},(_,gi)=>h('div',{key:gi,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
        h('div',{style:{border:`2px solid ${M.color}`,borderRadius:14,padding:'6px 7px',background:M.bg,display:'flex',flexWrap:'wrap',gap:2,justifyContent:'center',animation:`splitin .32s ${gi*0.07}s cubic-bezier(.175,.885,.32,1.275) both`,minWidth:bs*2+10}},
          Array.from({length:a},(_,i)=>h('div',{key:i,style:{width:bs,height:bs,background:M.color,borderRadius:5}}))
        ),
        h('div',{style:{fontSize:'.62rem',fontWeight:800,color:M.dark}},gi+1+'つ')
      ))
    )
  );
}

function DivVisual({a,b}){
  const X=OPC['×'],D=OPC['÷'];
  const perGroup=a/b;
  const [phase,setPhase]=useState('all');
  useEffect(()=>{setPhase('all');const t1=setTimeout(()=>setPhase('msg'),1800);const t2=setTimeout(()=>setPhase('split'),3000);return()=>{clearTimeout(t1);clearTimeout(t2);};},[a,b]);
  const bs=a<=36?18:a<=64?14:11;
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:7,padding:'4px'}},
    h('div',{style:{fontSize:'.76rem',fontWeight:800,color:phase==='all'?X.dark:D.dark,background:phase==='all'?X.bg:D.bg,borderRadius:50,padding:'3px 15px',marginBottom:4,animation:'msgin .3s both'}},
      phase==='all'?a+'こ あるよ！':phase==='msg'?a+'こを '+b+'グループに わけます':a+'こを '+b+'グループに わけました'
    ),
    phase!=='split'&&h('div',{style:{border:`2px solid ${X.color}`,borderRadius:14,padding:'8px 10px',background:X.bg,display:'flex',flexWrap:'wrap',gap:3,justifyContent:'flex-start',maxWidth:280,animation:'allin .5s cubic-bezier(.175,.885,.32,1.275) both'}},
      Array.from({length:a},(_,i)=>h('div',{key:i,style:{width:bs,height:bs,background:X.color,borderRadius:5,flexShrink:0}}))
    ),
    phase==='split'&&h('div',{style:{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',maxWidth:300}},
      Array.from({length:b},(_,gi)=>h('div',{key:gi,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
        h('div',{style:{border:`2px solid ${D.color}`,borderRadius:14,padding:'6px 7px',background:D.bg,display:'flex',flexWrap:'wrap',gap:2,justifyContent:'center',animation:`splitin .35s ${gi*0.07}s cubic-bezier(.175,.885,.32,1.275) both`,minWidth:bs*2+10}},
          Array.from({length:perGroup},(_,i)=>h('div',{key:i,style:{width:bs,height:bs,background:X.color,borderRadius:5}}))
        ),
        h('div',{style:{fontSize:'.62rem',fontWeight:800,color:D.dark}},gi+1+'つ')
      ))
    )
  );
}

function FruitVisual({a,b,op,fk,level}){
  return h('div',{key:fk,style:{marginBottom:4}},op==='+'?h(AddVisual,{a,b,level}):op==='-'?h(SubVisual,{a,b,level}):op==='×'?h(MulVisual,{a,b}):h(DivVisual,{a,b}));
}

/* ---------- 出題ロジック ---------- */
function genQuestions(op,dans,danMode,qCount,level){
  let pairs=[];
  if(op==='×'){
    const ds=danMode==='random'?[2,3,4,5,6,7,8,9]:(dans.size>0?[...dans]:[]);
    if(danMode==='junban'){ds.forEach(a=>{for(let b=1;b<=9;b++)pairs.push({a,b,op});});}
    else{ds.forEach(a=>{for(let b=1;b<=9;b++)pairs.push({a,b,op});});pairs=pairs.sort(()=>Math.random()-.5);const seen=new Set();pairs=pairs.filter(p=>{const k=p.a+'x'+p.b;if(seen.has(k))return false;seen.add(k);return true;});}
  }else if(op==='+'){
    const mx=level;for(let a=1;a<mx;a++)for(let b=1;a+b<=mx;b++)pairs.push({a,b,op});
    pairs=pairs.sort(()=>Math.random()-.5);
  }else if(op==='-'){
    const mx=level;for(let a=2;a<=mx;a++)for(let b=1;b<a;b++)pairs.push({a,b,op});
    pairs=pairs.sort(()=>Math.random()-.5);
  }else if(op==='÷'){
    const ds=danMode==='random'?[2,3,4,5,6,7,8,9]:(dans.size>0?[...dans]:[]);
    if(danMode==='junban'){ds.forEach(n=>{for(let q=1;q<=9;q++)pairs.push({a:n*q,b:n,op});});}
    else{ds.forEach(n=>{for(let q=1;q<=9;q++)pairs.push({a:n*q,b:n,op});});pairs=pairs.sort(()=>Math.random()-.5);const seen=new Set();pairs=pairs.filter(p=>{const k=p.a+'÷'+p.b;if(seen.has(k))return false;seen.add(k);return true;});}
  }
  if(danMode==='junban')return pairs.map(p=>{const ans=p.op==='×'?p.a*p.b:p.a/p.b;return{...p,ans};});
  return pairs.slice(0,qCount).map(p=>{const ans=p.op==='+'?p.a+p.b:p.op==='-'?p.a-p.b:p.op==='×'?p.a*p.b:p.a/p.b;return{...p,ans};});
}

function mkChoices(ans,op,level){
  const s=new Set([ans]);let t=0;const range=op==='×'||op==='÷'?10:Math.max(3,Math.floor(level/8));
  while(s.size<4&&t++<200){const d=Math.floor(Math.random()*(range*2+1))-range;const c=Math.max(1,ans+d);if(c!==ans)s.add(c);}
  return[...s].sort(()=>Math.random()-.5);
}

function Confetti({active}){
  const p=useRef(Array.from({length:60},(_,i)=>({id:i,left:Math.random()*100,color:['#FF6B6B','#FFD166','#4D96FF','#9775FA','#FFA94D','#51CF66'][i%6],size:7+Math.random()*8,dur:1.4+Math.random()*2,delay:Math.random()*.9,circle:Math.random()>.5}))).current;
  if(!active)return null;
  return h('div',{style:{position:'fixed',inset:0,pointerEvents:'none',zIndex:999,overflow:'hidden'}},p.map(x=>h('div',{key:x.id,style:{position:'absolute',top:'-12px',left:x.left+'%',width:x.size,height:x.size,background:x.color,borderRadius:x.circle?'50%':'3px',animation:`cfall ${x.dur}s ${x.delay}s linear forwards`}})));
}

function BackBtn({onClick,label}){return h('button',{className:'tapbtn',onClick,style:{alignSelf:'flex-start',background:'#fff',border:'none',borderRadius:50,padding:'8px 16px',fontWeight:800,fontSize:'.8rem',color:'#5B6376',boxShadow:'0 3px 10px rgba(32,36,47,.06)',marginBottom:14}},'← '+(label||'もどる'));}
function Stepper({value,min,max,onChange,accent,big10}){
  const dec=n=>onChange(Math.max(min,value-n));
  const inc=n=>onChange(Math.min(max,value+n));
  const Btn=(label,fn,muted)=>h('button',{className:'tapbtn',onClick:fn,style:{width:muted?38:46,height:muted?38:46,borderRadius:14,background:muted?'#F1F3F8':accent+'22',color:muted?'#8A93A6':accent,fontWeight:900,fontSize:muted?'.78rem':'1.1rem',border:'none'}},label);
  return h('div',{style:{display:'flex',alignItems:'center',gap:6,justifyContent:'center'}},
    big10&&Btn('-10',()=>dec(10),true),
    Btn('－',()=>dec(1)),
    h('div',{style:{minWidth:56,textAlign:'center',fontSize:'1.6rem',fontWeight:900,color:'#20242F'}},value),
    Btn('＋',()=>inc(1)),
    big10&&Btn('+10',()=>inc(10),true)
  );
}

        h('div',{style:{fontSize:'.78rem',fontWeight:800,color:'#8A93A6',textAlign:'center',marginBottom:6}},'まちがえた もんだい'),
        mistakes.length===0?h('div',{style:{textAlign:'center',color:'#8A93A6',fontWeight:700,padding:'8px 0'}},'まちがいなし！🎊'):
        h('div',{style:{display:'flex',flexDirection:'column',gap:5}},mistakes.map(({q:mq,chosen},i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',justifyContent:'space-between',background:OPC[mq.op].bg,borderRadius:11,padding:'7px 10px',fontWeight:700}},
          h('span',{style:{color:OPC[mq.op].color,fontSize:'.9rem'}},mq.a+' '+OPC[mq.op].sym+' '+mq.b),
          h('span',{style:{color:'#C9CEDA',margin:'0 3px'}},'→'),
          h('span',{style:{color:'#2E9E52',fontSize:'.9rem'}},'こたえ：'+mq.ans),
          h('span',{style:{fontSize:'.65rem',color:'#FFB4B4'}},'（'+chosen+'）')
        )))
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:8,width:'100%',maxWidth:220}},
        h('button',{className:'tapbtn',onClick:doStart,style:{background:`linear-gradient(135deg,${cfg.color},${cfg.dark})`,color:'white',borderRadius:50,padding:'13px 0',fontSize:'1rem',fontWeight:800,boxShadow:`0 10px 24px ${cfg.color}55`,letterSpacing:1}},'🔄 もういちど'),
        h('button',{className:'tapbtn',onClick:goTitle,style:{background:'white',color:cfg.color,borderRadius:50,padding:'13px 0',fontSize:'1rem',fontWeight:800,boxShadow:'0 4px 14px rgba(32,36,47,.06)',letterSpacing:1}},cfg.label+'にもどる'),
        h('button',{className:'tapbtn',onClick:goHome,style:{background:'#F1F3F8',color:'#5B6376',borderRadius:50,padding:'11px 0',fontSize:'.9rem',fontWeight:800,letterSpacing:1}},'🏠 ホームへ')
      )
    ),

    scr==='visualizer'&&h('div',{className:'view',style:{display:'flex',flexDirection:'column',alignItems:'center',width:'100%',maxWidth:380,position:'relative',zIndex:1}},
      h(BackBtn,{onClick:goHome}),
      h('div',{style:{fontSize:'1.3rem',fontWeight:900,marginBottom:4,textAlign:'center'}},'すうじビジュアル'),
      h('div',{style:{fontSize:'.76rem',color:'#8A93A6',fontWeight:700,marginBottom:14,textAlign:'center'}},'すきな かずを えらんで みてみよう'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,width:'100%',marginBottom:16}},
        Object.entries(OPC).map(([k,c])=>h('button',{key:k,className:'tapbtn',onClick:()=>pickVzOp(k),style:{background:vzOp===k?c.bg:'#fff',border:vzOp===k?`2px solid ${c.color}`:'2px solid transparent',borderRadius:16,padding:'10px 0',fontWeight:900,fontSize:'1.2rem',color:c.color,boxShadow:'0 4px 14px rgba(32,36,47,.06)'}},c.sym))
      ),
      h('div',{style:{background:'white',borderRadius:24,boxShadow:'0 10px 30px rgba(32,36,47,.08)',width:'100%',padding:'18px 16px',marginBottom:14}},
        vzOp==='÷'
          ?h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
              h('div',null,h('div',{style:{textAlign:'center',fontSize:'.74rem',fontWeight:800,color:vcfg.dark,marginBottom:6}},'1グループの かず'),h(Stepper,{value:vzQ,min:1,max:9,onChange:setVzQNum,accent:vcfg.color})),
              h('div',null,h('div',{style:{textAlign:'center',fontSize:'.74rem',fontWeight:800,color:vcfg.dark,marginBottom:6}},'なんグループに わける？'),h(Stepper,{value:vzB,min:1,max:9,onChange:setVzBNum,accent:vcfg.color})),
              h('div',{style:{textAlign:'center',fontSize:'.8rem',fontWeight:800,color:'#8A93A6'}},'ぜんぶで '+vA+'こ')
            )
          :h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
              h('div',null,h('div',{style:{textAlign:'center',fontSize:'.74rem',fontWeight:800,color:vcfg.dark,marginBottom:6}},vzOp==='×'?'1グループの かず':'1つめの かず'),h(Stepper,{value:vzA,min:vzOp==='×'?1:vzOp==='-'?1:0,max:vzOp==='×'?9:99,onChange:setVzANum,accent:vcfg.color,big10:vzOp!=='×'})),
              h('div',null,h('div',{style:{textAlign:'center',fontSize:'.74rem',fontWeight:800,color:vcfg.dark,marginBottom:6}},vzOp==='×'?'グループの かず':vzOp==='+'?'2つめの かず':'ひく かず'),h(Stepper,{value:vzB,min:vzOp==='×'?1:0,max:vzOp==='×'?9:vzOp==='-'?vzA:99,onChange:setVzBNum,accent:vcfg.color,big10:vzOp!=='×'}))
            )
      ),
      h('div',{style:{background:'white',borderRadius:24,boxShadow:'0 10px 30px rgba(32,36,47,.08)',width:'100%',padding:'16px 12px',marginBottom:10}},
        h(FruitVisual,{a:vA,b:vB,op:vzOp,fk:'vz-'+vzOp+vA+vB+vzQ,level:vzLevel}),
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop:10,fontSize:'1.6rem',fontWeight:900,flexWrap:'wrap'}},
          h('span',{style:{color:vcfg.color}},vA),h('span',{style:{color:vcfg.color}},vcfg.sym),h('span',{style:{color:vcfg.color}},vB),h('span',{style:{color:'#8A93A6'}},'='),
          vzReveal?h('span',{style:{color:'#2E9E52',animation:'fpop .3s both'}},vAns):h('button',{className:'tapbtn',onClick:()=>setVzReveal(true),style:{background:vcfg.bg,color:vcfg.color,borderRadius:14,padding:'4px 18px',fontWeight:900,fontSize:'1.1rem'}},'？')
        )
      ),
      h('div',{style:{fontSize:'.72rem',color:'#8A93A6',fontWeight:700,textAlign:'center'}},'？をタップすると こたえが みえるよ')
    )
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(h(App));
</script>
</body>
</html>
